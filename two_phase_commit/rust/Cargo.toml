[package]
name = "two_phase_commit"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }

[dev-dependencies]
rand = { version = "0.10.4", default-features = false, features = ["alloc", "std_rng"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
